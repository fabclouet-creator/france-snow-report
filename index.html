        --bg: #eef3fa;
        --card: #ffffff;
        --line: #dbe4f0;
        --snow: #2f7fd1;
        --snow-deep: #1b4f8f;
        --accent: #0a3060;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      header {
        background: linear-gradient(160deg, #0a3060 0%, #1d5aa8 55%, #3a86d1 100%);
        color: #fff; padding: 26px 20px 20px;
      }
      .wrap { max-width: 1100px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 0.3px; }
      .subtitle { margin: 0 0 14px; opacity: 0.92; font-size: 14px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
      input[type="search"], select, button {
        font: inherit; border-radius: 8px; border: none; padding: 8px 12px; outline: none;
      }
      input[type="search"] { flex: 1 1 200px; min-width: 170px; background: #fff; color: var(--ink); }
      select { background: #fff; color: var(--ink); cursor: pointer; }
      button { cursor: pointer; background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.45); }
      button:hover { background: rgba(255,255,255,0.28); }
      button.active { background: #fff; color: var(--accent); border-color: #fff; font-weight: 600; }
      .status-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; font-size: 12.5px; opacity: 0.95; }
      .meta { margin: 0; }
      main { padding: 18px 20px 30px; }
      .notice {
        max-width: 1100px; margin: 0 auto 14px; padding: 12px 14px; border-radius: 10px;
        font-size: 13.5px; line-height: 1.45; display: none;
      }
      .notice.show { display: block; }
      .notice.demo { background: #fff6e0; border: 1px solid #eccb7a; color: #6b4d00; }
      .notice.error { background: #fdeaea; border: 1px solid #e5a1a1; color: #7d1f1f; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 14px;
        padding: 14px 16px; position: relative; box-shadow: 0 1px 3px rgba(15,35,64,0.06);
      }
      .card h2 { margin: 0; font-size: 16.5px; padding-right: 30px; }
      .card .region { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
      .star {
        position: absolute; top: 10px; right: 10px; background: none; border: none;
        font-size: 19px; color: #c8d3e2; padding: 2px; line-height: 1;
      }
      .star.on { color: #f5b301; }
      .depth { display: flex; align-items: baseline; gap: 6px; }
      .depth strong { font-size: 30px; line-height: 1; color: var(--snow-deep); }
      .depth span { font-size: 13px; color: var(--muted); }
      .gauge { height: 8px; background: #e3ecf7; border-radius: 6px; margin: 10px 0 8px; overflow: hidden; }
      .gauge > div { height: 100%; background: linear-gradient(90deg, #7db9ea, #2f7fd1); border-radius: 6px; }
      .alts { margin: 6px 0 2px; }
      .alt-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); background: #f7faff; border-radius: 6px; padding: 3px 9px; margin-bottom: 3px; }
      .alt-row b { color: var(--snow-deep); font-weight: 600; white-space: nowrap; }
      .stats { display: flex; gap: 8px; }
      .stat {
        flex: 1; background: #f2f7ff; border-radius: 9px; padding: 7px 9px; font-size: 12px; color: var(--muted);
      }
      .stat b.warn { color: #c0392b; }
      .snowline { font-size: 12px; color: var(--muted); margin: 5px 0 0; }
      .snowline b { color: var(--snow-deep); font-weight: 600; }
      .chart-block { margin: 10px 0 0; }
      .chart-title { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
      .chart { display: flex; gap: 6px; }
      .cb {
        flex: 1; height: 56px; border-radius: 6px; background: rgba(125, 185, 234, .16);
        display: flex; flex-direction: column; justify-content: space-between; text-align: center; overflow: hidden;
      }
      .cb em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--snow-deep); padding-top: 3px; }
      .cb span { font-size: 10px; opacity: .7; padding-bottom: 3px; }
      .stat b { display: block; font-size: 15px; color: var(--ink); margin-top: 1px; }
      .temp { position: absolute; top: 12px; left: 14px; }
      .footer { max-width: 1100px; margin: 22px auto 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
      .footer a { color: var(--snow); }
      .empty { text-align: center; color: var(--muted); padding: 30px; }
      .view-hidden { display: none !important; }
      .map-wrap { position: relative; max-width: 760px; margin: 0 auto; }
      #map { width: 100%; display: block; background: #e7f0fb; border: 1px solid var(--line); border-radius: 14px; touch-action: none; cursor: grab; }
      .map-tools { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
      .map-tools button { width: 34px; height: 34px; border-radius: 8px; background: #fff; color: var(--accent); border: 1px solid var(--line); font-size: 17px; font-weight: 700; padding: 0; box-shadow: 0 1px 4px rgba(15,35,64,0.18); }
      .map-tools button:hover { background: #eef3fa; }
      .map-hint { font-size: 13px; color: var(--muted); margin: 4px 2px 8px; }
      .france { fill: #f5f8fd; stroke: #b9c9de; stroke-width: 1.5; }
      .dot { stroke: #fff; stroke-width: 1; cursor: pointer; }
      .dot:hover { stroke: var(--accent); stroke-width: 2; }
      .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 2px 16px; }
      .legend span { display: inline-flex; align-items: center; gap: 5px; }
      .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }
      .card.flash { outline: 3px solid #1d5aa8; outline-offset: 2px; }
      .cam-btn {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        width: calc(100% - 32px); margin-top: 10px; padding: 9px 12px; font-size: 13.5px; font-weight: 600;
        border: none; border-radius: 9px; color: #fff; cursor: pointer;
        background: linear-gradient(135deg, #2f7fd1, #1b4f8f);
        box-shadow: 0 2px 6px rgba(27,79,143,0.35);
      }
      .cam-state {
        display: inline-flex; align-items: center; justify-content: center;
        width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 700;
        background: rgba(255,255,255,0.25); flex: 0 0 auto;
      }
      .cam-state.s-ok { background: #22c55e; }
      .cam-state.s-ko { background: #ef4444; }
      .cam-state.s-none { background: rgba(255,255,255,0.28); opacity: 0.9; }
      .cam-state.s-wait { background: rgba(255,255,255,0.25); animation: camPulse 1.2s infinite; }
      @keyframes camPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .cam-btn:hover { background: linear-gradient(135deg, #3891e6, #2260ab); }
      .modal-back { position: fixed; inset: 0; background: rgba(10,30,55,0.62); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
      .modal-back.open { display: flex; }
      .modal { background: #fff; border-radius: 16px; max-width: 840px; width: 100%; max-height: 88vh; overflow: auto; padding: 18px 18px 14px; position: relative; }
      .modal h2 { margin: 0 40px 8px 0; font-size: 19px; }
      .close-x { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 8px; background: #f2f7ff; border: 1px solid var(--line); color: var(--ink); font-size: 15px; padding: 0; cursor: pointer; }
      .cam-img { width: 100%; border-radius: 10px; display: block; margin: 0 0 10px; }
      .cam-img.hide { display: none; }
      .cam-note { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
      .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
      .modal-actions button, .modal-actions a {
        font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 8px;
        background: #f2f7ff; border: 1px solid var(--line); color: var(--accent);
        text-decoration: none; cursor: pointer;
      }
      @media (max-width: 560px) { h1 { font-size: 21px; } .card .stats { flex-direction: column; } }
    </style>

        /* local backup: keep the last successful data 24h (survives 429 rate limits) */
        function saveCache() {

          catch (e) {}
        }
        function loadCache() {
          try {
            var raw = localStorage.getItem("fsr-cache");
            if (!raw) { return false; }
            var obj = JSON.parse(raw);
            if (!obj || !obj.d || !obj.t || (Date.now() - obj.t) > 604800000) { return false; }
            DATA = obj.d;
            lastUpdate = new Date(obj.t);
            return true;
          } catch (e) { return false; }
        }

        /* retry a failed chunk twice (handles HTTP 429 rate limits silently) */
        function fetchChunkRetry(list, attempts) {
          return fetchChunk(list).catch(function (e) {
            lastErr = (e && e.message) ? e.message : String(e);
            if (attempts > 0) {
              return new Promise(function (res) {
                setTimeout(function () { res(fetchChunkRetry(list, attempts - 1)); },
                  attempts === 2 ? 1200 : 2400);
              });
            }
            return false;
          });
        }

        function loadLive() {
          mode = "loading";
          lastErr = "";
          renderMeta();
          var slowEl = document.getElementById("slow-note");
          if (slowEl) { slowEl.classList.remove("show"); }
          var chunks = chunk(RESORTS, 39);
          var slowTimer = setTimeout(function () {
            if (mode === "loading" && slowEl) {
              slowEl.textContent = t("slowNote") + (lastErr ? " (" + lastErr + ")" : "");
              slowEl.classList.add("show");
            }
          }, 8000);
          return Promise.all(chunks.map(function (c, i) {
            return new Promise(function (res) {
              setTimeout(function () { res(fetchChunkRetry(c, 2)); }, i * 400);
            });
          })).then(function (results) {
            clearTimeout(slowTimer);
            if (slowEl) { slowEl.classList.remove("show"); }
            var ok = results.filter(Boolean).length;
            if (ok === chunks.length) { mode = "live"; }
            else if (ok > 0) { mode = "partial"; }
            else if (loadCache()) { mode = "cached"; }
            else { mode = "demo"; }
            if (mode === "live" || mode === "partial") { lastUpdate = new Date(); saveCache(); }
            render();
          });
        }

          if (code >= 45 && code <= 48) { return "🌫️"; }
          if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) { return "🌧️"; }
          if ((code >= 71 && code <= 77) || code === 85 || code === 86) { return "🌨️"; }
          if (code >= 95) { return "⛈️"; }

        /* rain/snow limit: altitude where the 0°C line sits (interpolated between the 3 levels) */
        function snowlineAlt(r, m) {
          if (!m || typeof m.tBase !== "number" || typeof m.tMid !== "number" ||
              typeof m.tTop !== "number") { return null; }
          if (m.tBase <= 0) { return "snow"; }
          if (m.tTop > 0) { return "rain"; }
          var a1 = r.ba, t1 = m.tBase, a2 = midAlt(r), t2 = m.tMid, a3 = r.top, t3 = m.tTop;
          if (t2 <= 0) { return Math.round(a1 + (a2 - a1) * (t1 / (t1 - t2))); }

          camPending[name] = true;

          var timer = setTimeout(function () { finish(false); }, 10000);

          if (mapWheel && mapWheel.addEventListener) {
            mapWheel.addEventListener("wheel", function (ev) {
              ev.preventDefault();
              zoomAtPoint(ev, ev.deltaY < 0 ? 1 / 1.18 : 1.18);
            }, { passive: false });
          }
        })();

        /* map drag / pinch (pointer events) */
        var mapPtrs = {};
        var mapDragged = false;
        onId("map", "pointerdown", function (ev) {
          mapPtrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: ev.clientX, sy: ev.clientY };
          mapDragged = false;
        });
        onId("map", "pointermove", function (ev) {
          if (!mapPtrs[ev.pointerId]) { return; }
          var svg = document.getElementById("map");
          var r = svg ? svg.getBoundingClientRect() : null;
          if (!r) { return; }
          var ids = Object.keys(mapPtrs);
          if (ids.length === 1) {
            var p = mapPtrs[ev.pointerId];
            var dx = (ev.clientX - p.x) / r.width * VB.w;
            var dy = (ev.clientY - p.y) / r.height * VB.h;
            mapPtrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: p.sx, sy: p.sy };
            VB.x -= dx;
            VB.y -= dy;
            clampVB();
            applyViewBox();
            if (Math.abs(ev.clientX - p.sx) + Math.abs(ev.clientY - p.sy) > 6) { mapDragged = true; }
          } else if (ids.length >= 2) {
            var a = mapPtrs[ids[0]];
            var bref = mapPtrs[ids[1]];
            var prevD = Math.sqrt((a.x - bref.x) * (a.x - bref.x) + (a.y - bref.y) * (a.y - bref.y)) || 1;
            mapPtrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: mapPtrs[ev.pointerId].sx, sy: mapPtrs[ev.pointerId].sy };
            var n1 = mapPtrs[ids[0]];
            var n2 = mapPtrs[ids[1]];
            var newD = Math.sqrt((n1.x - n2.x) * (n1.x - n2.x) + (n1.y - n2.y) * (n1.y - n2.y)) || 1;
            var mid = { clientX: (n1.x + n2.x) / 2, clientY: (n1.y + n2.y) / 2 };
            zoomAtPoint(mid, prevD / newD);
            mapDragged = true;
          }
        });
        function mapEndPtr(ev) { delete mapPtrs[ev.pointerId]; }
        onId("map", "pointerup", mapEndPtr);
        onId("map", "pointercancel", mapEndPtr);

        onId("map", "click", function (ev) {
          if (mapDragged) { mapDragged = false; return; }
          var n = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-n") : null;
          if (!n) { return; }
          setView("cards");
          render();
          var kids = grid.children || [];
          var card = null;
          for (var i = 0; i < kids.length; i++) {
            if (kids[i].getAttribute && kids[i].getAttribute("data-resort") === n) { card = kids[i]; break; }
          }
          if (!card) { return; }
          if (card.scrollIntoView) { try { card.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {} }
          card.classList.add("flash");
          setTimeout(function () { card.classList.remove("flash"); }, 1600);
        });
        grid.addEventListener("click", function (ev) {
          var camBtn = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-cams") : null;
          if (camBtn) { openCams(camBtn, false); return; }
          var btn = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-fav") : null;
          if (!btn) { return; }
          if (favs[btn]) { delete favs[btn]; } else { favs[btn] = true; }
          storeSet("fsr-fav", JSON.stringify(Object.keys(favs)));
          render();
        });
        onId("cam-close", "click", closeCams);
        onId("cam-refresh", "click", function () {
          if (currentCam) { openCams(currentCam, true); }
        });
        var modalBack = document.getElementById("cam-modal-back");
        if (modalBack) {
          modalBack.addEventListener("click", function (ev) {
            if (ev.target === modalBack) { closeCams(); }
          });
        }
        document.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" || ev.code === "Escape") { closeCams(); }
        });
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && mode !== "live") { loadLive(); }
        });

        /* ---------- go ---------- */
        applyViewBox();
        render();
        loadLive();
      })();
    </script>
