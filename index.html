<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a3060" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <title>France Snow Report · Bulletin Neige France</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        --ink: #0f2340;
        --muted: #5b6b81;
        --bg: #eef3fa;
        --card: #ffffff;
        --line: #dbe4f0;
        --snow: #2f7fd1;
        --snow-deep: #1b4f8f;
        --accent: #0a3060;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      header {
        background: linear-gradient(160deg, #0a3060 0%, #1d5aa8 55%, #3a86d1 100%);
        color: #fff; padding: 26px 20px 20px;
      }
      .wrap { max-width: 1100px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 0.3px; }
      .subtitle { margin: 0 0 14px; opacity: 0.92; font-size: 14px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
      input[type="search"], select, button {
        font: inherit; border-radius: 8px; border: none; padding: 8px 12px; outline: none;
      }
      input[type="search"] { flex: 1 1 200px; min-width: 170px; background: #fff; color: var(--ink); }
      select { background: #fff; color: var(--ink); cursor: pointer; }
      button { cursor: pointer; background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.45); }
      button:hover { background: rgba(255,255,255,0.28); }
      button.active { background: #fff; color: var(--accent); border-color: #fff; font-weight: 600; }
      .status-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; font-size: 12.5px; opacity: 0.95; }
      .meta { margin: 0; }
      main { padding: 18px 20px 30px; }
      .notice {
        max-width: 1100px; margin: 0 auto 14px; padding: 12px 14px; border-radius: 10px;
        font-size: 13.5px; line-height: 1.45; display: none;
      }
      .notice.show { display: block; }
      .notice.demo { background: #fff6e0; border: 1px solid #eccb7a; color: #6b4d00; }
      .notice.error { background: #fdeaea; border: 1px solid #e5a1a1; color: #7d1f1f; }
      .notice.alert { background: #eaf6ff; border: 1px solid #8ecbff; color: #0a4d7a; }
      .hide { display: none !important; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 14px;
        padding: 14px 16px; position: relative; box-shadow: 0 1px 3px rgba(15,35,64,0.06);
      }
      .card h2 { margin: 0; font-size: 16.5px; padding-right: 30px; }
      .card .region { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
      .star {
        position: absolute; top: 10px; right: 10px; background: none; border: none;
        font-size: 19px; color: #c8d3e2; padding: 2px; line-height: 1;
      }
      .star.on { color: #f5b301; }
      .depth { display: flex; align-items: baseline; gap: 6px; }
      .depth strong { font-size: 30px; line-height: 1; color: var(--snow-deep); }
      .depth span { font-size: 13px; color: var(--muted); }
      .gauge { height: 8px; background: #e3ecf7; border-radius: 6px; margin: 10px 0 8px; overflow: hidden; }
      .gauge > div { height: 100%; background: linear-gradient(90deg, #7db9ea, #2f7fd1); border-radius: 6px; }
      .alts { margin: 6px 0 2px; }
      .alt-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); background: #f7faff; border-radius: 6px; padding: 3px 9px; margin-bottom: 3px; }
      .alt-row b { color: var(--snow-deep); font-weight: 600; white-space: nowrap; }
      .stats { display: flex; gap: 8px; }
      .stat {
        flex: 1; background: #f2f7ff; border-radius: 9px; padding: 7px 9px; font-size: 12px; color: var(--muted);
      }
      .stat b.warn { color: #c0392b; }
      .snowline { font-size: 12px; color: var(--muted); margin: 5px 0 0; }
      .snowline b { color: var(--snow-deep); font-weight: 600; }
      .chart-block { margin: 10px 0 0; }
      .chart-title { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
      .chart { display: flex; gap: 4px; }
      .cb {
        flex: 1; height: 50px; border-radius: 6px; background: rgba(125, 185, 234, .16);
        display: flex; flex-direction: column; justify-content: space-between; text-align: center; overflow: hidden;
      }
      .cb em { font-style: normal; font-size: 10px; font-weight: 600; color: var(--snow-deep); padding-top: 3px; }
      .cb span { font-size: 9px; opacity: .7; padding-bottom: 3px; }
      .cb span.today { font-weight: 700; color: var(--snow-deep); opacity: 1; }
      /* top 10 + powder day */
      .top-wrap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 14px 2px 4px; }
      .top-wrap:empty { display: none; }
      .top-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-right: 2px; }
      .top-chip { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--ink); }
      .top-chip b { color: var(--snow-deep); margin-right: 4px; }
      .top-chip:hover { border-color: var(--snow); }
      .card.powder { border-color: var(--snow); box-shadow: 0 0 0 2px rgba(47, 127, 209, .30); }
      .pbadge { display: inline-block; margin: 6px 0 2px; padding: 2px 9px; border-radius: 999px; background: #e8f4ff; border: 1px solid #7db9ea; color: #0b4c75; font-size: 11px; font-weight: 700; }
      .stat b { display: block; font-size: 15px; color: var(--ink); margin-top: 1px; }
      .temp { position: absolute; top: 12px; left: 14px; }
      /* v13: near-me / gallery / compare / detail */
      .dist { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #eaf3fe; border: 1px solid #cfe3f6; color: #1b4f8f; font-size: 10.5px; font-weight: 600; }
      .dt-btn { display: block; margin: 8px auto 2px; padding: 3px 12px; font-size: 11.5px; font-weight: 600; color: #1b4f8f; background: #eaf3fe; border: 1px solid #cfe3f6; border-radius: 999px; cursor: pointer; }
      .dt-btn:hover { background: #dceafb; }
      .cam-btn.sel { outline: 2px solid #f5b301; outline-offset: 1px; }
      #cmp-tray { display: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; box-shadow: 0 4px 18px rgba(15,30,60,.18); z-index: 50; max-width: 92vw; flex-wrap: wrap; }
      #cmp-tray.show { display: flex; }
      #cmp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .cmp-chip { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #eaf3fe; border: 1px solid #cfe3f6; color: #1b4f8f; cursor: pointer; }
      #cmp-open { white-space: nowrap; }
      .cmp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
      .cmp-table th, .cmp-table td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; }
      .cmp-table th { background: #f2f7ff; }
      .glm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; text-align: left; }
      .glm-cell h3 { font-size: 13.5px; margin: 0 0 8px; }
      .glm-cell .cam-img { margin: 0 0 8px; }
      .mt-svg { width: 100%; max-width: 470px; display: block; margin: 0 auto 12px; border-radius: 12px; border: 1px solid var(--line); }
      .mt-lbl { font: 600 10.5px system-ui, sans-serif; fill: #1b4f8f; }
      .mt-sub { font-size: 9.5px; font-weight: 500; }
      .mts1 { stop-color: #7fb1dd; } .mts2 { stop-color: #cfe3f4; } .mts3 { stop-color: #f3e9d8; }
      .mtr-far { fill: #b6c9dd; } .mtr-mid { fill: #94aec9; }
      .mtr-main { fill: #6f93b5; stroke: #55708e; stroke-width: 1; }
      .mt-face { fill: rgba(255,255,255,.10); }
      .mtc-bg { fill: rgba(255,255,255,.88); stroke: #9fc4e8; stroke-width: .8; }
      .mt-leader { stroke: rgba(27,79,143,.45); }
      .dt-rank { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 10px; }
      .dt-open { text-align: center; font-size: 12.5px; color: var(--accent); margin: -4px 0 10px; }
      .dt-actions { margin-top: 10px; }
      .dt-body .card { width: 100%; max-width: 350px; margin: 0 auto; }
      button:disabled { opacity: .5; cursor: default; }
      .footer { max-width: 1100px; margin: 22px auto 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
      .footer a { color: var(--snow); }
      .empty { text-align: center; color: var(--muted); padding: 30px; }
      .view-hidden { display: none !important; }
      .map-wrap { position: relative; max-width: 760px; margin: 0 auto; }
      #map { width: 100%; display: block; background: #e7f0fb; border: 1px solid var(--line); border-radius: 14px; touch-action: none; cursor: grab; }
      .map-tools { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
      .map-tools button { width: 34px; height: 34px; border-radius: 8px; background: #fff; color: var(--accent); border: 1px solid var(--line); font-size: 17px; font-weight: 700; padding: 0; box-shadow: 0 1px 4px rgba(15,35,64,0.18); }
      .map-tools button:hover { background: #eef3fa; }
      .map-hint { font-size: 13px; color: var(--muted); margin: 4px 2px 8px; }
      .france { fill: #f5f8fd; stroke: #b9c9de; stroke-width: 1.5; }
      .dot { stroke: #fff; stroke-width: 1; cursor: pointer; }
      .dot:hover { stroke: var(--accent); stroke-width: 2; }
      .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 2px 16px; }
      .legend span { display: inline-flex; align-items: center; gap: 5px; }
      .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }
      .card.flash { outline: 3px solid #1d5aa8; outline-offset: 2px; }
      .cam-btn {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        width: calc(100% - 32px); margin-top: 10px; padding: 9px 12px; font-size: 13.5px; font-weight: 600;
        border: none; border-radius: 9px; color: #fff; cursor: pointer;
        background: linear-gradient(135deg, #2f7fd1, #1b4f8f);
        box-shadow: 0 2px 6px rgba(27,79,143,0.35);
      }
      .cam-state {
        display: inline-flex; align-items: center; justify-content: center;
        width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 700;
        background: rgba(255,255,255,0.25); flex: 0 0 auto;
      }
      .cam-state.s-ok { background: #22c55e; }
      .cam-state.s-ko { background: #ef4444; }
      .cam-state.s-none { background: rgba(255,255,255,0.28); opacity: 0.9; }
      .cam-state.s-wait { background: rgba(255,255,255,0.25); animation: camPulse 1.2s infinite; }
      @keyframes camPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .cam-btn:hover { background: linear-gradient(135deg, #3891e6, #2260ab); }
      .modal-back { position: fixed; inset: 0; background: rgba(10,30,55,0.62); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
      .modal-back.open { display: flex; }
      .modal { background: #fff; border-radius: 16px; max-width: 840px; width: 100%; max-height: 88vh; overflow: auto; padding: 18px 18px 14px; position: relative; }
      .modal h2 { margin: 0 40px 8px 0; font-size: 19px; }
      .close-x { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 8px; background: #f2f7ff; border: 1px solid var(--line); color: var(--ink); font-size: 15px; padding: 0; cursor: pointer; }
      .cam-img { width: 100%; border-radius: 10px; display: block; margin: 0 0 10px; }
      .cam-img.hide { display: none; }
      .cam-note { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
      .cam-count { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-right: auto; }
      .cam-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: camPulse 1.6s infinite; flex: none; }
      .cam-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; margin: 0 0 10px; }
      .cam-scroll .cam-img { width: auto; max-width: none; height: 280px; margin: 0; border-radius: 10px; }
      .cam-scroll.hide { display: none; }
      .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
      .modal-actions button, .modal-actions a {
        font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 8px;
        background: #f2f7ff; border: 1px solid var(--line); color: var(--accent);
        text-decoration: none; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #e8eef7; --muted: #9db0ca; --bg: #0c1524; --card: #16233a; --line: #2b3d5c; --snow: #7ab8ee; --snow-deep: #a9cdf5; --accent: #c3dbf6; }
        header { background: linear-gradient(160deg, #061a35 0%, #123c74 55%, #1d5aa8 100%); }
        input[type="search"], select { background: #16233a; color: var(--ink); border: 1px solid var(--line); }
        button.active { background: var(--accent); color: #061a35; border-color: var(--accent); }
        .notice.demo { background: #473a14; border-color: #8a6d1f; color: #ffd76a; }
        .notice.error { background: #45201f; border-color: #a05b5b; color: #ffa5a5; }
        .notice.alert { background: #123047; border-color: #2b6f9e; color: #a9d8ff; }
        .gauge { background: #22314e; }
        .alt-row, .stat { background: #1d2c47; }
        .alt-row b { color: #a9cdf5; }
        .cb { background: rgba(125, 185, 234, .10); }
        .pbadge { background: rgba(122, 184, 238, .12); border-color: #3d5f8a; color: #a9cdf5; }
        .card { box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
        .card.flash { outline-color: #7ab8ee; }
        #map { background: #101c30; }
        .map-tools button { background: #16233a; color: #c3dbf6; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
        .map-tools button:hover { background: #21334f; }
        .france { fill: #1b2c48; stroke: #3d577d; }
        .dot { stroke: #101c30; }
        .modal { background: #16233a; color: var(--ink); }
        .modal-actions button, .modal-actions a { background: #1d2c47; color: #c3dbf6; border-color: var(--line); }
        .dist { background: rgba(122, 184, 238, .12); border-color: #3d5f8a; color: #c3dbf6; }
        .cmp-chip { background: rgba(122, 184, 238, .12); border-color: #3d5f8a; color: #c3dbf6; }
        #cmp-tray { box-shadow: 0 4px 18px rgba(0, 0, 0, .5); }
        .cmp-table th { background: #1d2c47; }
        .mt-lbl { fill: #c3dbf6; }
        .mts1 { stop-color: #101e33; } .mts2 { stop-color: #0d1a2e; } .mts3 { stop-color: #0c1524; }
        .mtr-far { fill: #263a58; } .mtr-mid { fill: #2f4a6d; } .mtr-main { fill: #3c5a7e; stroke: #2b4262; }
        .mt-face { fill: rgba(255,255,255,.06); }
        .mtc-bg { fill: rgba(22,35,58,.92); stroke: #3d5f8a; }
        .mt-leader { stroke: rgba(163,205,245,.55); }
        .dt-btn { background: rgba(122, 184, 238, .12); border-color: #3d5f8a; color: #c3dbf6; }
      }
      @media (max-width: 560px) { h1 { font-size: 21px; } .card .stats { flex-direction: column; } }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1 id="t-title"></h1>
        <p class="subtitle" id="t-sub"></p>
        <div class="toolbar">
          <input type="search" id="search" />
          <select id="region">
            <option value="all" id="t-allregions"></option>
          </select>
          <select id="sort">
            <option value="depth" id="o-depth"></option>
            <option value="fresh" id="o-fresh"></option>
            <option value="forecast" id="o-forecast"></option>
            <option value="name" id="o-name"></option>
          </select>
          <button id="view-cards"></button>
          <button id="view-map"></button>
          <button id="fav-toggle"></button>
          <button id="nearme"></button>
          <button id="cmp-toggle"></button>
          <button id="cams-all"></button>
          <button id="don-btn"></button>
          <button id="install-btn" class="hide"></button>
          <button id="refresh"></button>
          <button id="lang"></button>
        </div>
        <div class="status-row">
          <p class="meta" id="t-meta"></p>
        </div>
      </div>
    </header>
    <main class="wrap">
      <div class="notice demo" id="demo-note"></div>
      <div class="notice error" id="err-note"></div>
      <div class="notice demo" id="slow-note"></div>
      <div class="notice alert" id="alert-note"></div>
      <div id="top10" class="top-wrap"></div>
      <div class="grid" id="grid"></div>
      <div id="map-view" class="view-hidden">
        <p class="map-hint" id="map-hint"></p>
        <div class="map-wrap">
          <svg id="map" viewBox="0 0 700 660" role="img" aria-label="Carte des stations / Map of resorts">
            <g id="map-outline"></g>
            <g id="map-dots"></g>
          </svg>
          <div class="map-tools">
            <button id="zoom-in" type="button">+</button>
            <button id="zoom-out" type="button">−</button>
            <button id="zoom-reset" type="button">⟳</button>
          </div>
        </div>
        <div class="legend">
          <span><i class="sw" style="background:#d3dce8"></i>0</span>
          <span><i class="sw" style="background:#8fc1ea"></i>1-30</span>
          <span><i class="sw" style="background:#4f9adb"></i>31-60</span>
          <span><i class="sw" style="background:#2f7fd1"></i>61-100</span>
          <span><i class="sw" style="background:#1b4f8f"></i>100+ cm</span>
          <span style="color:#f5b301;font-weight:700">★ <span id="t-favlegend"></span></span>
        </div>
      </div>
      <div class="modal-back" id="cam-modal-back">
        <div class="modal" role="dialog" aria-modal="true">
          <button class="close-x" id="cam-close" type="button">✕</button>
          <h2 id="cam-title"></h2>
          <div id="cam-body"></div>
          <div class="modal-actions">
            <span id="cam-count" class="cam-count"></span>
            <button id="cam-refresh" type="button"></button>
            <a id="cam-more" href="#" target="_blank" rel="noopener"></a>
          </div>
        </div>
      </div>
      <div class="modal-back" id="gallery-back">
        <div class="modal" role="dialog" aria-modal="true">
          <button class="close-x" id="gallery-close" type="button">✕</button>
          <h2 id="gallery-title"></h2>
          <div class="glm-grid" id="gallery-body"></div>
        </div>
      </div>
      <div class="modal-back" id="detail-back">
        <div class="modal" role="dialog" aria-modal="true">
          <button class="close-x" id="detail-close" type="button">✕</button>
          <h2 id="detail-title"></h2>
          <div class="dt-body" id="dt-body"></div>
          <div class="modal-actions dt-actions">
            <button type="button" id="dt-share">🔗</button>
            <button type="button" id="dt-alert"></button>
          </div>
        </div>
      </div>
      <div class="modal-back" id="cmp-back">
        <div class="modal" role="dialog" aria-modal="true">
          <button class="close-x" id="cmp-close" type="button">✕</button>
          <h2 id="cmp-title"></h2>
          <div id="cmp-body"></div>
        </div>
      </div>
      <div id="cmp-tray">
        <div id="cmp-chips"></div>
        <button id="cmp-open" type="button"></button>
      </div>
      <p class="footer" id="t-footer"></p>
    </main>

    <script>
      (function () {
        "use strict";

        /* ---------- Resorts (name, region, lat, lon, top altitude m, base altitude m) ---------- */
        var RESORTS = [
          { n: "Chamonix Mont-Blanc", r: "haute-savoie", la: 45.92, lo: 6.87, top: 3275, ba: 1035 },
          { n: "Les Houches", r: "haute-savoie", la: 45.90, lo: 6.79, top: 1900, ba: 1000 },
          { n: "Megève (Evasion Mont-Blanc)", r: "haute-savoie", la: 45.86, lo: 6.62, top: 2350, ba: 1113 },
          { n: "La Clusaz", r: "haute-savoie", la: 45.90, lo: 6.42, top: 2470, ba: 1100 },
          { n: "Le Grand-Bornand", r: "haute-savoie", la: 45.94, lo: 6.36, top: 2050, ba: 1000 },
          { n: "Les Contamines", r: "haute-savoie", la: 45.80, lo: 6.73, top: 2500, ba: 1170 },
          { n: "Avoriaz", r: "haute-savoie", la: 46.19, lo: 6.84, top: 2266, ba: 1800 },
          { n: "Morzine", r: "haute-savoie", la: 46.19, lo: 6.71, top: 2012, ba: 1000 },
          { n: "Les Gets", r: "haute-savoie", la: 46.15, lo: 6.67, top: 2002, ba: 1150 },

        function camStateCls(name) {
          if (!WC[name] || !WC[name].length) { return "s-none"; }

          var tip = (cls === "s-ok") ? t("camOk") : (cls === "s-ko") ? t("camKo") :
            (cls === "s-none") ? t("camNoneShort") : t("camWait");
          return '<span class="cam-state ' + cls + '" data-camstate="' + escapeHtml(name) + '" title="' + escapeHtml(tip) + '">' + ic + "</span>";
        }
        function setCamState(name, cls) {
          if (!document.querySelectorAll) { return; }
          var nodes;
          try { nodes = document.querySelectorAll('span[data-camstate="' + name + '"]'); }
          catch (e) { return; }
          var ic = (cls === "s-ok") ? "✓" : "✕";
          var tip = (cls === "s-ok") ? t("camOk") : t("camKo");
          for (var i = 0; i < nodes.length; i++) {
            var n = nodes[i];
            n.className = "cam-state " + cls;
            n.textContent = ic;
            n.title = tip;
          }
        }
        function camProbeUrl(u) {
          if (u.indexOf("images.bergfex.at") >= 0 && u.indexOf("format=4") >= 0) {
            return u.replace("format=4", "format=1");
          }
          return u;
        }
        function checkCam(name) {
          var urls = WC[name] || [];
          if (!urls.length) { return; }
          if (Object.prototype.hasOwnProperty.call(camOk, name)) {
            setCamState(name, camOk[name] ? "s-ok" : "s-ko");
            return;
          }
          if (typeof Image === "undefined" || camPending[name]) { return; }
          camPending[name] = true;
          var img = new Image();
          var done = false;
          function finish(okFlag) {
            if (done) { return; }
            done = true;
            camOk[name] = okFlag;
            setCamState(name, okFlag ? "s-ok" : "s-ko");
          }
          var timer = setTimeout(function () { finish(false); }, 10000);
          var cands = isSkap(urls[0]) ? skapCandidates(urls[0]) : [camProbeUrl(urls[0])];
          var si = 0;
          img.onload = function () { clearTimeout(timer); finish(true); };
          img.onerror = function () {
            si += 1;
            if (si < cands.length) { img.src = cands[si]; return; }
            clearTimeout(timer); finish(false);
          };
          img.src = cands[0];
        }

            if (q && r.n.toLowerCase().indexOf(q) === -1 &&

            return true;
          });

          function val(r, key) {
            var m = metric(r);
            if (!m) { return key === "name" ? r.n : -1; }
            if (key === "name") { return r.n; }

            return (typeof v === "number") ? v : -1;

          list.sort(function (a, b) {

          var html = "";
          list.forEach(function (r) {
            if (mode === "loading") { html += cardHtml(r, null); }
            else { html += cardHtml(r, metric(r)); }
          });
          grid.innerHTML = html;
          checkCams();
          renderCmpTray();
        }

        /* ---------- events ---------- */
        var searchTimer = null;
        elSearch.addEventListener("input", function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(render, 120);
        });
        elRegion.addEventListener("change", render);
        elSort.addEventListener("change", function () { sortNear = false; render(); });
        elFav.addEventListener("click", function () {
          favOnly = !favOnly;
          render();
        });
        elRefresh.addEventListener("click", function () { loadLive(); });
        elLang.addEventListener("click", function () {
          LANG = (LANG === "fr") ? "en" : "fr";
          storeSet("fsr-lang", LANG);
          render();
        });
        onId("view-cards", "click", function () { setView("cards"); });
        onId("view-map", "click", function () { setView("map"); });
        onId("zoom-in", "click", function () { zoomAtPoint(null, 1 / 1.3); });
        onId("zoom-out", "click", function () { zoomAtPoint(null, 1.3); });
        onId("zoom-reset", "click", function () {
          VB = { x: 0, y: 0, w: MAP_W, h: MAP_H };
          applyViewBox();
        });
        (function () {
          var mapWheel = document.getElementById("map");
          if (mapWheel && mapWheel.addEventListener) {
            mapWheel.addEventListener("wheel", function (ev) {
              ev.preventDefault();
              zoomAtPoint(ev, ev.deltaY < 0 ? 1 / 1.18 : 1.18);
            }, { passive: false });
          }
        })();

        /* map drag / pinch (pointer events) */
        var mapPtrs = {};
        var mapDragged = false;
        onId("map", "pointerdown", function (ev) {
          mapPtrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: ev.clientX, sy: ev.clientY };
          mapDragged = false;
        });
        onId("map", "pointermove", function (ev) {
          if (!mapPtrs[ev.pointerId]) { return; }
          var svg = document.getElementById("map");
          var r = svg ? svg.getBoundingClientRect() : null;
          if (!r) { return; }
          var ids = Object.keys(mapPtrs);
          if (ids.length === 1) {
            var p = mapPtrs[ev.pointerId];
            var dx = (ev.clientX - p.x) / r.width * VB.w;
            var dy = (ev.clientY - p.y) / r.height * VB.h;
            mapPtrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: p.sx, sy: p.sy };
            VB.x -= dx;
            VB.y -= dy;
            clampVB();
            applyViewBox();
            if (Math.abs(ev.clientX - p.sx) + Math.abs(ev.clientY - p.sy) > 6) { mapDragged = true; }
          } else if (ids.length >= 2) {
            var a = mapPtrs[ids[0]];
            var bref = mapPtrs[ids[1]];
            var prevD = Math.sqrt((a.x - bref.x) * (a.x - bref.x) + (a.y - bref.y) * (a.y - bref.y)) || 1;
            mapPtrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: mapPtrs[ev.pointerId].sx, sy: mapPtrs[ev.pointerId].sy };
            var n1 = mapPtrs[ids[0]];
            var n2 = mapPtrs[ids[1]];
            var newD = Math.sqrt((n1.x - n2.x) * (n1.x - n2.x) + (n1.y - n2.y) * (n1.y - n2.y)) || 1;
            var mid = { clientX: (n1.x + n2.x) / 2, clientY: (n1.y + n2.y) / 2 };
            zoomAtPoint(mid, prevD / newD);
            mapDragged = true;
          }
        });
        function mapEndPtr(ev) { delete mapPtrs[ev.pointerId]; }
        onId("map", "pointerup", mapEndPtr);
        onId("map", "pointercancel", mapEndPtr);

        function jumpToCard(n) {
          setView("cards");
          render();
          var kids = grid.children || [];
          var card = null;
          for (var i = 0; i < kids.length; i++) {
            if (kids[i].getAttribute && kids[i].getAttribute("data-resort") === n) { card = kids[i]; break; }
          }
          if (!card) { return; }
          if (card.scrollIntoView) { try { card.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {} }
          card.classList.add("flash");
          setTimeout(function () { card.classList.remove("flash"); }, 1600);
        }
        onId("map", "click", function (ev) {
          if (mapDragged) { mapDragged = false; return; }
          var n = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-n") : null;
          if (!n) { return; }
          jumpToCard(n);
        });
        onId("top10", "click", function (ev) {
          var n = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-top") : null;
          if (!n) { return; }
          jumpToCard(n);
        });
        grid.addEventListener("click", function (ev) {
          var camBtn = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-cams") : null;
          if (camBtn) { openCams(camBtn, false); return; }
          var detBtn = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-detail") : null;
          if (detBtn) { openDetail(detBtn); return; }
          var cmpSel = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-cmp") : null;
          if (cmpSel) { toggleCompare(cmpSel); return; }
          var btn = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-fav") : null;
          if (!btn) { return; }
          if (favs[btn]) { delete favs[btn]; } else { favs[btn] = true; }
          storeSet("fsr-fav", JSON.stringify(Object.keys(favs)));
          render();
        });
        onId("cam-close", "click", closeCams);
        onId("cam-refresh", "click", function () {
          if (currentCam) { openCams(currentCam, true); }
        });
        var modalBack = document.getElementById("cam-modal-back");
        if (modalBack) {
          modalBack.addEventListener("click", function (ev) {
            if (ev.target === modalBack) { closeCams(); }
          });
        }
        onId("gallery-close", "click", closeGallery);
        onId("detail-close", "click", closeDetail);
        onId("dt-share", "click", function () {
          var label = dtName || t("title");
          var rr = dtName ? resortByName(dtName) : null;
          var mm = rr ? metric(rr) : null;
          var txt = label + (mm && typeof mm.depth === "number" ? " · " + mm.depth + " cm" : "") + " · France Snow Report ❄️";
          if (typeof navigator !== "undefined" && navigator.share) {
            navigator.share({ title: label, text: txt, url: location.href }).catch(function () {});
            return;
          }
          if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt + " " + location.href).then(function () {
              setTxt("dt-share", t("shareOk"));
              setTimeout(function () { setTxt("dt-share", t("share")); }, 2500);
            }, function () {});
          }
        });
        onId("dt-alert", "click", function () {
          if (!dtName) { return; }
          if (AL[dtName]) { delete AL[dtName]; }
          else {
            AL[dtName] = true;
            if (typeof Notification !== "undefined" && Notification.requestPermission) {
              try { Notification.requestPermission(); } catch (e) {}
            }
          }
          storeSet("fsr-alerts", JSON.stringify(Object.keys(AL)));
          refreshAlertBtn();
        });
        onId("don-btn", "click", function () {
          if (DON_URL && typeof window !== "undefined" && window.open) {
            try { window.open(DON_URL, "_blank"); } catch (e) {}
          }
        });
        onId("cmp-close", "click", closeCompare);
        onId("cmp-open", "click", openCompare);
        onId("cams-all", "click", openGallery);
        onId("cmp-toggle", "click", function () {
          cmpMode = !cmpMode;
          if (!cmpMode) { cmp = {}; }
          render();
        });
        onId("cmp-chips", "click", function (ev) {
          var n = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-crm") : null;
          if (n && cmp[n]) { delete cmp[n]; render(); }
        });
        onId("nearme", "click", function () {
          var btn = document.getElementById("nearme");
          if (sortNear) { sortNear = false; render(); return; }
          if (typeof navigator === "undefined" || !navigator.geolocation || !navigator.geolocation.getCurrentPosition) {
            if (btn) { btn.title = t("nearmeErr"); }
            return;
          }
          navigator.geolocation.getCurrentPosition(function (pos) {
            userPos = { la: pos && pos.coords ? pos.coords.latitude : 0, lo: pos && pos.coords ? pos.coords.longitude : 0 };
            sortNear = true;
            render();
          }, function () {
            if (btn) { btn.title = t("nearmeErr"); }
          });
        });
        ["gallery-back", "detail-back", "cmp-back"].forEach(function (idz) {
          var elz = document.getElementById(idz);
          if (elz) {
            elz.addEventListener("click", function (ev) {
              if (ev.target === elz) { closeGallery(); closeDetail(); closeCompare(); }
            });
          }
        });
        document.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" || ev.code === "Escape") { closeCams(); closeGallery(); closeDetail(); closeCompare(); }
        });
        document.addEventListener("visibilitychange", function () {
          var cb = document.getElementById("cam-modal-back");
          var camOpen = !!(cb && cb.classList.contains && cb.classList.contains("open"));
          if (document.hidden) { stopCamAuto(); }
          else if (camOpen) { startCamAuto(); }
          if (!document.hidden && mode !== "live") { loadLive(); }
        });

        /* ---------- v18: rafraichissement auto des donnees (15 min) ---------- */
        if (typeof setInterval === "function") {
          setInterval(function () {
            if (document.hidden || mode !== "live" || !lastUpdate) { return; }
            if (Date.now() - lastUpdate.getTime() > 15 * 60000) { loadLive(); }
          }, 5 * 60000);
        }

        /* ---------- v20 : evenements d'installation navigateur ---------- */
        if (typeof window !== "undefined" && window.addEventListener) {
          window.addEventListener("beforeinstallprompt", function (e) {
            try { e.preventDefault(); } catch (er) {}
            installEvt = e;
            showInstallBtn();
          });
          window.addEventListener("appinstalled", function () {
            var b = document.getElementById("install-btn");
            if (b) { b.classList.add("hide"); }
          });
        }

        /* ---------- v19 : installable comme app (service worker) ---------- */
        if (typeof navigator !== "undefined" && navigator.serviceWorker &&
            typeof location !== "undefined" && location.protocol &&
            location.protocol.indexOf("http") === 0) {
          try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
        }

        /* ---------- go ---------- */
        applyViewBox();
        render();
        loadLive();
      })();
    </script>
