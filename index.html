        /* ---------- v13: resort detail + mountain ---------- */
        var mtSeq = 0;
        function mountainSvg(r, m) {
          if (!m) { return ""; }
          var top = r.top, ba = r.ba, mid = midAlt(r);
          var yTop = 38, yBa = 190;
          function yFor(alt) { return yBa - ((alt - ba) / Math.max(1, top - ba)) * (yBa - yTop); }
          var sl = snowlineAlt(r, m);
          var capY = (typeof sl === "number")
            ? Math.max(yTop + 6, Math.min(yBa - 8, Math.round(yFor(sl))))
            : yTop + 30;
          var dd = function (v) { return (typeof v === "number") ? v + " cm" : "…"; };
          var tt = function (v) { return (typeof v === "number") ? ((v > 0 ? "+" : "") + v + "°C") : "…"; };
          /* jagged alpine ridge, defined once */
          var pts = [
            [14, 196], [52, 156], [78, 168], [106, 120], [120, 130], [150, 70],
            [170, 38], [198, 86], [218, 80], [252, 124], [274, 112], [300, 168], [326, 196]
          ];
          var ridge = pts.map(function (q) { return q[0] + "," + q[1]; }).join(" ");
          function edgesAt(y) {
            var xs = [];
            for (var i = 0; i < pts.length - 1; i++) {
              var a2 = pts[i], b2 = pts[i + 1];
              var dy = b2[1] - a2[1];
              if (Math.abs(dy) < 0.001) { continue; }
              if (y >= Math.min(a2[1], b2[1]) && y <= Math.max(a2[1], b2[1])) {
                xs.push(a2[0] + ((y - a2[1]) / dy) * (b2[0] - a2[0]));
              }
            }
            if (!xs.length) { return null; }
            return [Math.min.apply(null, xs), Math.max.apply(null, xs)];
          }
          mtSeq++;
          var idSky = "mtsky" + mtSeq, idSn = "mtsn" + mtSeq, idSh = "mtsh" + mtSeq, idClip = "mtc" + mtSeq;
          var h = '<svg class="mt-svg" viewBox="0 0 340 220" role="img" aria-label="' + escapeHtml(r.n) + '">';
          h += '<defs>';
          h += '<linearGradient id="' + idSky + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" class="mts1"/><stop offset=".55" class="mts2"/><stop offset="1" class="mts3"/></linearGradient>';
          h += '<linearGradient id="' + idSn + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcebf8"/></linearGradient>';
          h += '<linearGradient id="' + idSh + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" stop-color="#14283f" stop-opacity=".32"/><stop offset=".7" stop-color="#14283f" stop-opacity="0"/></linearGradient>';
          /* snow drape: wavy clip along the rain/snow limit so snow follows the terrain */
          h += '<clipPath id="' + idClip + '"><path d="M0,' + capY + ' q14,10 28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 L340,' + capY + ' L340,0 L0,0 Z"/></clipPath>';
          h += '</defs>';
          /* sky, sun, clouds, birds */
          h += '<rect x="0" y="0" width="340" height="220" fill="url(#' + idSky + ')"/>';
          h += '<circle cx="44" cy="44" r="15" fill="#ffe9b8" opacity=".35"/><circle cx="44" cy="44" r="8" fill="#ffe9b8"/>';
          h += '<ellipse cx="252" cy="54" rx="24" ry="6" fill="#fff" opacity=".55"/>';
          h += '<ellipse cx="292" cy="66" rx="16" ry="5" fill="#fff" opacity=".45"/>';
          h += '<ellipse cx="86" cy="92" rx="18" ry="5" fill="#fff" opacity=".4"/>';
          h += '<path d="M96,40 q4,-4 8,0 M108,36 q4,-4 8,0" stroke="#37506e" stroke-width="1" fill="none" opacity=".6"/>';
          /* far ridges (atmospheric perspective) */
          h += '<polygon points="0,196 34,142 96,196" class="mtr-far"/>';
          h += '<polygon points="108,196 150,136 208,196" class="mtr-far"/>';
          h += '<polygon points="228,196 292,128 340,196" class="mtr-far"/>';
          h += '<polygon points="0,196 58,164 118,196" class="mtr-mid"/>';
          h += '<polygon points="252,196 306,158 340,196" class="mtr-mid"/>';
          /* main ridge with sunlit west face */
          h += '<polygon points="' + ridge + '" class="mtr-main" stroke-linejoin="round"/>';
          h += '<polygon points="14,196 52,156 78,168 106,120 120,130 150,70 170,38 170,196" class="mt-face"/>';
          h += '<polygon points="' + ridge + '" fill="url(#' + idSh + ')"/>';
          /* snow above the wavy limit, following the ridge */
          h += '<polygon points="' + ridge + '" fill="url(#' + idSn + ')" clip-path="url(#' + idClip + ')"/>';
          /* snow tongues in the gullies below the limit */
          [Math.min(capY + 18, 150), Math.min(capY + 36, 160)].forEach(function (sy, k) {
            if (k === 1 && capY > 130) { return; }
            var e = edgesAt(sy);
            if (e && e[1] - e[0] > 46) {
              var w = e[1] - e[0] - 20;
              h += '<path d="M' + (e[0] + 10) + "," + sy + " q" + Math.round(w * .3) + ",-10 " + Math.round(w * .6) +
                ",-2 q" + Math.round(w * .2) + ",5 " + Math.round(w * .4) + ",-4" +
                '" stroke="#fff" stroke-width="' + (k === 0 ? 4 : 3.5) + '" fill="none" stroke-linecap="round" opacity=".5"/>';
            }
          });
          /* snowy valley floor with piste village */
          h += '<path d="M0,196 Q84,182 170,190 Q258,198 340,186 L340,220 L0,220 Z" fill="url(#' + idSn + ')"/>';
          h += '<path d="M60,206 L86,194" stroke="#c9dced" stroke-width="1" opacity=".8"/>' +
            '<path d="M220,204 L252,193" stroke="#c9dced" stroke-width="1" opacity=".8"/>';
          function tree(x2, th) {
            return '<polygon points="' + x2 + "," + (195 - th) + " " + (x2 - Math.max(3, Math.round(th * 0.4))) + ",195 " + (x2 + Math.max(3, Math.round(th * 0.4))) + ',195" fill="#3f6b4f"/>' +
              '<polygon points="' + x2 + "," + (195 - th - 1) + " " + (x2 - Math.max(2, Math.round(th * 0.3))) + "," + (195 - Math.round(th * .45)) + " " + (x2 + Math.max(2, Math.round(th * 0.3))) + "," + (195 - Math.round(th * .45)) + '" fill="#4a7a5c"/>';
          }
          function chalet(x2) {
            return '<g><rect x="' + x2 + '" y="186" width="15" height="9" fill="#6b4f3a"/>' +
              '<polygon points="' + (x2 - 2) + ",186 " + (x2 + 7) + ",179 " + (x2 + 17) + ',186" fill="#f4f8fc" stroke="#d7e1ec" stroke-width="0.5"/>' +
              '<rect x="' + (x2 + 5) + '" y="188" width="4" height="4" fill="#ffd27a"/></g>';
          }
          h += tree(64, 13) + tree(80, 9) + tree(96, 15) + tree(258, 12) + tree(272, 8) + tree(308, 14);
          h += chalet(28) + chalet(128) + chalet(290);
          /* rain/snow limit dashed line (if a numeric limit exists) */
          if (typeof sl === "number") {
            var slY = Math.round(yFor(sl));
            var se = edgesAt(slY);
            if (se && se[1] - se[0] > 20 && slY > yTop + 4 && slY < yBa - 4) {
              h += '<line x1="' + Math.round(se[0] + 4) + '" y1="' + slY + '" x2="' + Math.round(se[1] - 4) +

          /* altitude info chips + leader lines */
          function chip(labelTxt, alt, depth, temp) {
            var y = Math.round(yFor(alt));
            var cy = Math.max(4, Math.min(176, y - 13));
            var lead = "";
            var e = edgesAt(y);
            if (e && e[0] > 134) {
              lead = '<line x1="128" y1="' + y + '" x2="' + Math.round(Math.min(e[0], 166)) + '" y2="' + y +
                '" class="mt-leader" stroke-dasharray="3 3" stroke-width="1"/>';
            }
            return lead +
              '<rect x="10" y="' + cy + '" width="118" height="26" rx="7" class="mtc-bg"/>' +
              '<text x="16" y="' + (cy + 12) + '" class="mt-lbl">' + escapeHtml(labelTxt + " " + alt + " m") + "</text>" +
              '<text x="16" y="' + (cy + 22) + '" class="mt-lbl mt-sub">' + escapeHtml(tt(temp) + " · " + dd(depth)) + "</text>";
          }
          h += chip(t("altSummit"), top, m.dTop, m.tTop);
          h += chip(t("altMid"), mid, m.dMid, m.tMid);
          h += chip(t("altVillage"), ba, m.dBase, m.tBase);
          h += "</svg>";
          return h;
        }
        var dtName = "";

        /* ---------- webcam availability badge ---------- */
        var camOk = {}      /* resort -> true|false once probed */

          if (!WC[name] || !WC[name].length) { return "s-none"; }

          var tip = (cls === "s-ok") ? t("camOk") : (cls === "s-ko") ? t("camKo") :
            (cls === "s-none") ? t("camNoneShort") : t("camWait");
          return '<span class="cam-state ' + cls + '" data-camstate="' + escapeHtml(name) + '" title="' + escapeHtml(tip) + '">' + ic + "</span>";
        }
        function setCamState(name, cls) {

          var nodes;
          try { nodes = document.querySelectorAll('span[data-camstate="' + name + '"]'); }
          catch (e) { return; }
          var ic = (cls === "s-ok") ? "✓" : "✕";
          var tip = (cls === "s-ok") ? t("camOk") : t("camKo");
          for (var i = 0; i < nodes.length; i++) {

            n.textContent = ic;
            n.title = tip;

          return u;

        function checkCam(name) {
          var urls = WC[name] || [];
          if (!urls.length) { return; }
          if (Object.prototype.hasOwnProperty.call(camOk, name)) {
            setCamState(name, camOk[name] ? "s-ok" : "s-ko");
            return;
          }
          if (typeof Image === "undefined" || camPending[name]) { return; }
          camPending[name] = true;
          var img = new Image();
          var done = false;
          function finish(okFlag) {
            if (done) { return; }
            done = true;
            camOk[name] = okFlag;
            setCamState(name, okFlag ? "s-ok" : "s-ko");
          }
          var timer = setTimeout(function () { finish(false); }, 10000);
          var cands = isSkap(urls[0]) ? skapCandidates(urls[0]) : [camProbeUrl(urls[0])];
          var si = 0;
          img.onload = function () { clearTimeout(timer); finish(true); };
          img.onerror = function () {
            si += 1;
            if (si < cands.length) { img.src = cands[si]; return; }
            clearTimeout(timer); finish(false);
          };
          img.src = cands[0];
        }

            seen[name] = true;
            checkCam(name);

        onId("map", "pointerdown", function (ev) {
          mapPtrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: ev.clientX, sy: ev.clientY };
          mapDragged = false;
        });
        onId("map", "pointermove", function (ev) {
          if (!mapPtrs[ev.pointerId]) { return; }
          var svg = document.getElementById("map");
          var r = svg ? svg.getBoundingClientRect() : null;
          if (!r) { return; }
          var ids = Object.keys(mapPtrs);
          if (ids.length === 1) {
            var p = mapPtrs[ev.pointerId];
            var dx = (ev.clientX - p.x) / r.width * VB.w;
            var dy = (ev.clientY - p.y) / r.height * VB.h;
            mapPtrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: p.sx, sy: p.sy };
            VB.x -= dx;
            VB.y -= dy;
            clampVB();
            applyViewBox();
            if (Math.abs(ev.clientX - p.sx) + Math.abs(ev.clientY - p.sy) > 6) { mapDragged = true; }
          } else if (ids.length >= 2) {
            var a = mapPtrs[ids[0]];
            var bref = mapPtrs[ids[1]];
            var prevD = Math.sqrt((a.x - bref.x) * (a.x - bref.x) + (a.y - bref.y) * (a.y - bref.y)) || 1;
            mapPtrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: mapPtrs[ev.pointerId].sx, sy: mapPtrs[ev.pointerId].sy };
            var n1 = mapPtrs[ids[0]];
            var n2 = mapPtrs[ids[1]];
            var newD = Math.sqrt((n1.x - n2.x) * (n1.x - n2.x) + (n1.y - n2.y) * (n1.y - n2.y)) || 1;
            var mid = { clientX: (n1.x + n2.x) / 2, clientY: (n1.y + n2.y) / 2 };
            zoomAtPoint(mid, prevD / newD);
            mapDragged = true;
          }
        });

        /* ---------- v25 : radar neige/pluie temps reel (RainViewer) + relief (Esri) + zoom + deplacement ---------- */
        var RADAR_API = "https://api.rainviewer.com/public/weather-maps.json";
        var RADAR_TTL = 10 * 60 * 1000;
        var HILL_URL = "https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/";
        var RADAR_ZMIN = 6, RADAR_ZMAX = 8;
        var RADAR_RAINMAX = 7; /* pluie RainViewer limitee a z7, au-dela: image "Zoom Level Not Supported" */
        var radarData = null;
        var radarTiles = null;
        var radarErrEl = null;
        var radarWorldEl = null;
        var radarPos = 0;
        var radarTimer = null;
        var radarView = null;
        var radarDrag = null;
        var radarMoved = false;

        function mercN(la) {
          var r = Math.PI / 180;
          return Math.log(Math.tan(Math.PI / 4 + la * r / 2));
        }
        function wT(z) { return 256 * Math.pow(2, z); }
        function wPx(lo, z) { return (lo + 180) / 360 * wT(z); }
        function wPy(la, z) { return (0.5 - mercN(la) / (2 * Math.PI)) * wT(z); }
        function radarSize() {
          var mEl = document.getElementById("radar-map");
          var w = (mEl && mEl.clientWidth) || 700;
          var h = (mEl && mEl.clientHeight) || 660;
          return { w: Math.max(320, w), h: Math.max(320, h) };
        }
        function radarClamp() {
          if (!radarView) { return; }
          var z = radarView.z;
          var lonA = LON_MIN - 2.0, lonB = LON_MAX + 2.0;
          var latA = LAT_MIN - 1.2, latB = LAT_MAX - 1.0;
          var cxA = wPx(lonA, z), cxB = wPx(lonB, z);
          var cyN = wPy(latB, z), cyS = wPy(latA, z); /* nord = plus petit en pixels */
          radarView.cx = Math.min(cxB, Math.max(cxA, radarView.cx));
          radarView.cy = Math.min(cyS, Math.max(cyN, radarView.cy));
        }
        function radarRender() {
          var mapEl = document.getElementById("radar-map");
          if (!mapEl) { return; }
          if (!radarView) {
            radarView = { z: RADAR_ZMIN, cx: wPx((LON_MIN + LON_MAX) / 2, RADAR_ZMIN), cy: wPy((LAT_MIN + LAT_MAX) / 2, RADAR_ZMIN) };
          }
          var z = radarView.z;
          radarClamp();
          var sz = radarSize();
          var ox = radarView.cx - sz.w / 2, oy = radarView.cy - sz.h / 2;
          var world = radarWorldEl;
          if (!world || world.parentElement !== mapEl) {
            world = document.createElement("div");
            world.setAttribute("class", "radar-world");
            mapEl.appendChild(world);
            radarWorldEl = world;
          }
          while (world.firstChild) { world.removeChild(world.firstChild); }
          radarTiles = [];
          var x0 = Math.floor(ox / 256), x1 = Math.floor((ox + sz.w) / 256);
          var y0 = Math.floor(oy / 256), y1 = Math.floor((oy + sz.h) / 256);
          for (var tx = x0; tx <= x1; tx++) {
            for (var ty = y0; ty <= y1; ty++) {
              var lft = tx * 256 - ox, top = ty * 256 - oy;
              var hill = document.createElement("img");
              hill.setAttribute("class", "radar-hill");
              hill.setAttribute("draggable", "false");
              hill.src = HILL_URL + z + "/" + ty + "/" + tx;
              hill.style.left = lft + "px";
              hill.style.top = top + "px";
              hill.style.width = "256px";
              hill.style.height = "256px";
              world.appendChild(hill);
            }
          }
          var zr = Math.min(z, RADAR_RAINMAX);
          var rs = Math.pow(2, z - zr);
          var x0r = Math.floor(ox / (256 * rs)), x1r = Math.floor((ox + sz.w) / (256 * rs));
          var y0r = Math.floor(oy / (256 * rs)), y1r = Math.floor((oy + sz.h) / (256 * rs));
          for (var txr = x0r; txr <= x1r; txr++) {
            for (var tyr = y0r; tyr <= y1r; tyr++) {
              var rain = document.createElement("img");
              rain.setAttribute("class", "radar-tile");
              rain.setAttribute("draggable", "false");
              rain.style.left = (txr * 256 * rs - ox) + "px";
              rain.style.top = (tyr * 256 * rs - oy) + "px";
              rain.style.width = (256 * rs) + "px";
              rain.style.height = (256 * rs) + "px";
              world.appendChild(rain);
              radarTiles.push({ rain: rain, txr: txr, tyr: tyr });
            }
          }
          var svg = '<svg viewBox="0 0 ' + sz.w + " " + sz.h + '" style="left:0;top:0;width:' + sz.w + "px;height:" + sz.h + 'px;">';
          var lblItems = [];
          RESORTS.forEach(function (r) {
            var px = wPx(r.lo, z) - ox, py = wPy(r.la, z) - oy;
            svg += '<circle class="radar-dot" cx="' + px.toFixed(1)
              + '" cy="' + py.toFixed(1)
              + '" r="4" data-n="' + escapeHtml(r.n) + '"></circle>';
            if (px > -40 && py > -20 && px < sz.w + 40 && py < sz.h + 20) {
              lblItems.push({ n: r.n, x: px, y: py, pr: (r.top || 0) });
            }
          });
          var pickedLbls = labelPick(lblItems, { dot: 4.5, font: 9, cw: 4.9 });
          for (var li = 0; li < pickedLbls.length; li++) {
            var lb = pickedLbls[li];
            svg += '<text class="radar-lbl" data-n="' + lb.n + '" x="' + lb.x.toFixed(1) + '" y="' + lb.y.toFixed(1) + '" text-anchor="' + lb.anchor + '">' + lb.n + '</text>';
          }
          svg += "</svg>";
          if (typeof world.insertAdjacentHTML === "function") { world.insertAdjacentHTML("beforeend", svg); }
          else { world.innerHTML = svg; }
          if (!radarErrEl || radarErrEl.parentElement !== mapEl) {
            var err2 = document.createElement("div");
            err2.setAttribute("id", "radar-err");
            mapEl.appendChild(err2);
            radarErrEl = err2;
          }
        }
        function radarShow(pos) {
          if (!radarData || !radarData.frames.length || !radarTiles || !radarTiles.length) { return; }
          var n = radarData.frames.length;
          pos = ((pos % n) + n) % n;
          radarPos = pos;
          var f = radarData.frames[pos];
          var z = radarView ? radarView.z : RADAR_ZMIN;
          for (var i = 0; i < radarTiles.length; i++) {
            var tl = radarTiles[i];
            tl.rain.src = radarData.host + f.path + "/256/" + Math.min(z, RADAR_RAINMAX) + "/" + tl.txr + "/" + tl.tyr + "/2/1_1.png";
          }
          var tEl = document.getElementById("radar-time");
          if (tEl) {
            var d = new Date(f.time * 1000);
            var hh = ("0" + d.getHours()).slice(-2), mi = ("0" + d.getMinutes()).slice(-2);
            tEl.textContent = hh + ":" + mi;
          }
          var fl = document.getElementById("radar-flag");
          if (fl) {
            if (f.fut) {
              var mins = Math.round((f.time - radarData.nowTs) / 60);
              fl.textContent = "+" + mins + " min " + t("radarSoon");
              fl.classList.add("show");
            } else { fl.classList.remove("show"); }
          }
        }
        function radarStop() {
          if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; }
          var b = document.getElementById("radar-play");
          if (b) { b.textContent = "\u25b6"; }
        }
        function radarTick() {
          radarShow(radarPos + 1);
          radarTimer = setTimeout(radarTick, 700);
        }
        function radarPlay() {
          if (radarTimer) { radarStop(); return; }
          var b = document.getElementById("radar-play");
          if (b) { b.textContent = "\u23f8"; }
          radarTick();
        }
        function radarZoom(dz) {
          if (!radarView) { radarRender(); }
          if (!radarView) { return; }
          var nz = Math.max(RADAR_ZMIN, Math.min(RADAR_ZMAX, radarView.z + dz));
          if (nz === radarView.z) { return; }
          var k = wT(nz) / wT(radarView.z);
          radarView.cx *= k;
          radarView.cy *= k;
          radarView.z = nz;
          radarRender();
          if (radarData && !radarTimer) { radarShow(radarPos); }
        }
        function radarLoad() {
          radarRender();
          if (radarData) {
            if (radarErrEl) { radarErrEl.classList.remove("show"); }
            if (!radarTimer) { radarShow(radarPos); }
            return;
          }
          if (radarErrEl) { radarErrEl.textContent = t("radarLoad"); radarErrEl.classList.add("show"); }
          fetch(RADAR_API).then(function (r) { return r.json(); }).then(function (j) {
            radarData = { host: j.host, at: Date.now(), frames: [], idxNow: 0, nowTs: 0 };
            (j.radar && j.radar.past ? j.radar.past : []).forEach(function (q) {
              radarData.frames.push({ time: q.time, path: q.path, fut: false });
            });
            radarData.idxNow = Math.max(0, radarData.frames.length - 1);
            (j.radar && j.radar.nowcast ? j.radar.nowcast : []).forEach(function (q) {
              radarData.frames.push({ time: q.time, path: q.path, fut: true });
            });
            if (!radarData.frames.length) { throw new Error("empty"); }
            radarData.nowTs = radarData.frames[radarData.idxNow].time;
            if (radarErrEl) { radarErrEl.classList.remove("show"); }
            radarShow(radarData.idxNow);
          }).catch(function () {
            radarData = null;
            if (radarErrEl) { radarErrEl.textContent = t("radarOff"); radarErrEl.classList.add("show"); }
          });
        }
        function openRadar() {
          var back = document.getElementById("radar-back");
          if (!back) { return; }
          back.classList.add("open");
          radarLoad();
        }
        function closeRadar() {
          radarStop();
          var back = document.getElementById("radar-back");
          if (back) { back.classList.remove("open"); }
        }
        onId("radar-btn", "click", openRadar);
        onId("radar-close", "click", closeRadar);
        onId("radar-prev", "click", function () { radarStop(); radarShow(radarPos - 1); });
        onId("radar-next", "click", function () { radarStop(); radarShow(radarPos + 1); });
        onId("radar-play", "click", radarPlay);
        onId("radar-zin", "click", function () { radarZoom(1); });
        onId("radar-zout", "click", function () { radarZoom(-1); });
        onId("radar-map", "click", function (ev) {
          if (radarMoved) { return; }
          var nm = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-n") : null;
          if (nm) { closeRadar(); openDetail(nm); }
        });
        onId("radar-map", "pointerdown", function (ev) {
          radarDrag = { x: (ev && ev.clientX) || 0, y: (ev && ev.clientY) || 0, dx: 0, dy: 0, moved: false };
          radarMoved = false;
        });
        onId("radar-map", "pointermove", function (ev) {
          if (!radarDrag || !radarWorldEl) { return; }
          var dx = (ev && ev.clientX || 0) - radarDrag.x;
          var dy = (ev && ev.clientY || 0) - radarDrag.y;
          if (Math.abs(dx) + Math.abs(dy) > 6) { radarDrag.moved = true; radarMoved = true; }
          radarDrag.dx = dx;
          radarDrag.dy = dy;
          radarWorldEl.style.transform = "translate(" + dx + "px," + dy + "px)";
        });
        onId("radar-map", "pointerup", function () {
          var d = radarDrag;
          radarDrag = null;
          if (!d || !d.moved) { return; }
          if (radarWorldEl) { radarWorldEl.style.transform = ""; }
          if (!radarView) { return; }
          radarView.cx -= d.dx;
          radarView.cy -= d.dy;
          radarRender();
          if (radarData && !radarTimer) { radarShow(radarPos); }
        });
        onId("radar-map", "pointerleave", function () {
          if (radarDrag && radarWorldEl) { radarWorldEl.style.transform = ""; }
          radarDrag = null;
        });
        onId("radar-map", "pointercancel", function () {
          if (radarDrag && radarWorldEl) { radarWorldEl.style.transform = ""; }
          radarDrag = null;
        });
        onId("radar-map", "wheel", function (ev) {
          if (ev && ev.preventDefault) { ev.preventDefault(); }
          radarZoom(ev && ev.deltaY < 0 ? 1 : -1);
        });

        onId("dt-alert", "click", function () {
          if (!dtName) { return; }
          if (AL[dtName]) { delete AL[dtName]; }
          else {
            AL[dtName] = true;
            if (typeof Notification !== "undefined" && Notification.requestPermission) {
              try { Notification.requestPermission(); } catch (e) {}
            }
          }
          storeSet("fsr-alerts", JSON.stringify(Object.keys(AL)));
          refreshAlertBtn();
        });
        var donToastTimer = null;
        onId("don-btn", "click", function () {
          var dtn = document.getElementById("don-toast");
          if (DON_URL && typeof window !== "undefined" && window.open) {
            try { window.open(DON_URL, "_blank"); } catch (e) {}
            return;
          }
          if (dtn) {
            dtn.textContent = t("donSoon");
            dtn.classList.add("show");
            if (donToastTimer) { clearTimeout(donToastTimer); }
            donToastTimer = setTimeout(function () { dtn.classList.remove("show"); }, 2500);
          }
        });
        onId("cmp-close", "click", closeCompare);
        onId("cmp-open", "click", openCompare);
        onId("cams-all", "click", openGallery);
        onId("cmp-toggle", "click", function () {
          cmpMode = !cmpMode;
          if (!cmpMode) { cmp = {}; }
          render();
        });
        onId("cmp-chips", "click", function (ev) {
          var n = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-crm") : null;
          if (n && cmp[n]) { delete cmp[n]; render(); }
        });
        onId("nearme", "click", function () {
          var btn = document.getElementById("nearme");
          if (sortNear) { sortNear = false; render(); return; }
          if (typeof navigator === "undefined" || !navigator.geolocation || !navigator.geolocation.getCurrentPosition) {
            if (btn) { btn.title = t("nearmeErr"); }
            return;
          }
          navigator.geolocation.getCurrentPosition(function (pos) {
            userPos = { la: pos && pos.coords ? pos.coords.latitude : 0, lo: pos && pos.coords ? pos.coords.longitude : 0 };
            sortNear = true;
            render();
          }, function () {
            if (btn) { btn.title = t("nearmeErr"); }
          });
        });
        ["gallery-back", "detail-back", "cmp-back", "feedback-back", "radar-back"].forEach(function (idz) {
          var elz = document.getElementById(idz);
          if (elz) {
            elz.addEventListener("click", function (ev) {
              if (ev.target === elz) { closeGallery(); closeDetail(); closeCompare(); closeFeedback(); closeRadar(); }
            });
          }
        });
        document.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" || ev.code === "Escape") { closeCams(); closeGallery(); closeDetail(); closeCompare(); closeFeedback(); closeRadar(); }
        });
        document.addEventListener("visibilitychange", function () {
          var cb = document.getElementById("cam-modal-back");
          var camOpen = !!(cb && cb.classList.contains && cb.classList.contains("open"));
          if (document.hidden) { stopCamAuto(); }
          else if (camOpen) { startCamAuto(); }
          if (!document.hidden && mode !== "live") { loadLive(); }
        });

        /* ---------- v18: rafraichissement auto des donnees (15 min) ---------- */
        if (typeof setInterval === "function") {
          setInterval(function () {
            if (document.hidden || mode === "loading") { return; }
            /* v30: en live, rafraichit au bout de 15 min; sinon (demo/partial/cached), retente tout seul toutes les 5 min */
            var grace = (mode === "live") ? 15 * 60000 : 5 * 60000;
            var last = lastUpdate ? lastUpdate.getTime() : 0;
            if (Date.now() - last > grace) { loadLive(); }
          }, 5 * 60000);
        }

        /* ---------- v20 : evenements d'installation navigateur ---------- */
        if (typeof window !== "undefined" && window.addEventListener) {
          window.addEventListener("beforeinstallprompt", function (e) {
            try { e.preventDefault(); } catch (er) {}
            installEvt = e;
            showInstallBtn();
          });
          window.addEventListener("appinstalled", function () {
            var b = document.getElementById("install-btn");
            if (b) { b.classList.add("hide"); }
          });
        }

        /* ---------- v19 : installable comme app (service worker) ---------- */
        if (typeof navigator !== "undefined" && navigator.serviceWorker &&
            typeof location !== "undefined" && location.protocol &&
            location.protocol.indexOf("http") === 0) {
          try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
        }

        /* ---------- go ---------- */
        applyViewBox();
        render();
        loadLive();
      })();
    </script>
  </body>
</html>
