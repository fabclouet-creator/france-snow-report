<!doctype html>

    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        --ink: #0f2340;
        --muted: #5b6b81;
        --bg: #eef3fa;
        --card: #ffffff;
        --line: #dbe4f0;
        --snow: #2f7fd1;
        --snow-deep: #1b4f8f;
        --accent: #0a3060;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      header {
        background: linear-gradient(160deg, #0a3060 0%, #1d5aa8 55%, #3a86d1 100%);
        color: #fff; padding: 26px 20px 20px;
      }
      .wrap { max-width: 1100px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 0.3px; }
      .subtitle { margin: 0 0 14px; opacity: 0.92; font-size: 14px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
      input[type="search"], select, button {
        font: inherit; border-radius: 8px; border: none; padding: 8px 12px; outline: none;
      }
      input[type="search"] { flex: 1 1 200px; min-width: 170px; background: #fff; color: var(--ink); }
      select { background: #fff; color: var(--ink); cursor: pointer; }
      button { cursor: pointer; background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.45); }
      button:hover { background: rgba(255,255,255,0.28); }
      button.active { background: #fff; color: var(--accent); border-color: #fff; font-weight: 600; }
      .status-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; font-size: 12.5px; opacity: 0.95; }
      .meta { margin: 0; }
      main { padding: 18px 20px 30px; }
      .notice {
        max-width: 1100px; margin: 0 auto 14px; padding: 12px 14px; border-radius: 10px;
        font-size: 13.5px; line-height: 1.45; display: none;
      }
      .notice.show { display: block; }
      .notice.demo { background: #fff6e0; border: 1px solid #eccb7a; color: #6b4d00; }
      .notice.error { background: #fdeaea; border: 1px solid #e5a1a1; color: #7d1f1f; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 14px;
        padding: 14px 16px; position: relative; box-shadow: 0 1px 3px rgba(15,35,64,0.06);
      }
      .card h2 { margin: 0; font-size: 16.5px; padding-right: 30px; }
      .card .region { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
      .star {
        position: absolute; top: 10px; right: 10px; background: none; border: none;
        font-size: 19px; color: #c8d3e2; padding: 2px; line-height: 1;
      }
      .star.on { color: #f5b301; }
      .depth { display: flex; align-items: baseline; gap: 6px; }
      .depth strong { font-size: 30px; line-height: 1; color: var(--snow-deep); }
      .depth span { font-size: 13px; color: var(--muted); }
      .gauge { height: 8px; background: #e3ecf7; border-radius: 6px; margin: 10px 0 12px; overflow: hidden; }
      .gauge > div { height: 100%; background: linear-gradient(90deg, #7db9ea, #2f7fd1); border-radius: 6px; }
      .stats { display: flex; gap: 8px; }
      .stat {
        flex: 1; background: #f2f7ff; border-radius: 9px; padding: 7px 9px; font-size: 12px; color: var(--muted);
      }
      .stat b { display: block; font-size: 15px; color: var(--ink); margin-top: 1px; }
      .temp { position: absolute; top: 12px; left: 14px; }
      .footer { max-width: 1100px; margin: 22px auto 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
      .footer a { color: var(--snow); }
      .empty { text-align: center; color: var(--muted); padding: 30px; }
      @media (max-width: 560px) { h1 { font-size: 21px; } .card .stats { flex-direction: column; } }
    </style>
  </head>

        function storeGet(k, d) {

        }

        /* ---------- deterministic demo data ---------- */
        function demoFor(r) {
          var h = 0;
          var s = r.n;
          for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 100000; }
          return {

            forecast: (h >> 3) % 24,

        /* ---------- live fetch (Open-Meteo, free, no key) ---------- */
        function chunk(arr, n) {
          var out = [];
          for (var i = 0; i < arr.length; i += n) { out.push(arr.slice(i, i + n)); }
          return out;
        }

        function fetchChunk(list) {
          var la = list.map(function (x) { return x.la.toFixed(2); }).join(",");
          var lo = list.map(function (x) { return x.lo.toFixed(2); }).join(",");
          var url = "https://api.open-meteo.com/v1/forecast?latitude=" + la +
            "&longitude=" + lo +
            "&current=temperature_2m" +
            "&hourly=snow_depth" +
            "&daily=snowfall_sum" +
            "&past_days=1&forecast_days=3&timezone=Europe%2FParis";
          var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
          var abortTimer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 30000) : null;
          var p = ctrl ? fetch(url, { signal: ctrl.signal }) : fetch(url);
          p = p.then(function (res) {
            if (!res.ok) { throw new Error("HTTP " + res.status); }
            return res.json();
          }).then(function (data) {
            var arr = Array.isArray(data) ? data : [data];
            list.forEach(function (r, i) {
              var d = arr[i];
              if (!d) { return; }
              var m = { depth: null, fresh: 0, forecast: 0, temp: null };

              if (d.current && typeof d.current.temperature_2m === "number") {
                m.temp = Math.round(d.current.temperature_2m);
              }
              var daily = d.daily && d.daily.snowfall_sum;
              if (daily && daily.length >= 4) {
                m.fresh = Math.round((daily[0] + 0) * 10) / 10;   /* last full day */
                m.forecast = Math.round(((daily[1] || 0) + (daily[2] || 0) + (daily[3] || 0)) * 10) / 10;
              }
              var hourly = d.hourly && d.hourly.snow_depth;
              if (hourly) {
                /* start of hourly array = yesterday 00:00, so "now" is index 24 + current hour */
                var nowHour = 24;
                if (d.current && d.current.time) {
                  var hh = parseInt(d.current.time.slice(11, 13), 10);
                  if (hh >= 0 && hh <= 24) { nowHour = 24 + hh; }
                }
                var max24 = -1;
                var seen = false;
                var start = Math.max(1, nowHour - 23);
                var end = Math.min(nowHour + 1, hourly.length);
                for (var j = start; j < end; j++) {
                  var v = hourly[j];
                  if (typeof v === "number") { seen = true; if (v > max24) { max24 = v; } }
                }
                if (seen && max24 >= 0) { m.depth = Math.round(max24 * 100); }
              }
              DATA[r.n] = m;
            });
            return true;
          });
          if (abortTimer) {
            p = p.then(
              function (v) { clearTimeout(abortTimer); return v; },
              function (e) { clearTimeout(abortTimer); throw e; }
            );
          }
          return p;
        }

        function loadLive() {
          mode = "loading";
          lastErr = "";
          renderMeta();
          var slowEl = document.getElementById("slow-note");
          if (slowEl) { slowEl.classList.remove("show"); }
          var chunks = chunk(RESORTS, 20);
          var slowTimer = setTimeout(function () {
            if (mode === "loading" && slowEl) {
              slowEl.textContent = t("slowNote") + (lastErr ? " (" + lastErr + ")" : "");
              slowEl.classList.add("show");
            }
          }, 8000);
          return Promise.all(chunks.map(function (c) {
            return fetchChunk(c).catch(function (e) {
              lastErr = (e && e.message) ? e.message : String(e);
              return false;
            });
          })).then(function (results) {
            clearTimeout(slowTimer);
            if (slowEl) { slowEl.classList.remove("show"); }
            var ok = results.filter(Boolean).length;
            if (ok === chunks.length) { mode = "live"; }
            else if (ok > 0) { mode = "partial"; }
            else { mode = "demo"; }
            if (mode !== "demo") { lastUpdate = new Date(); }
            render();
          });
        }

        function t(k) { return T[LANG][k]; }
        function setTxt(id, val) {
          var el = document.getElementById(id);
          if (el) { el.textContent = val; }
        }
        function setHtml(id, val) {
          var el = document.getElementById(id);
          if (el) { el.innerHTML = val; }
        }
        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function metric(r) {
          if (DATA[r.n]) { return DATA[r.n]; }
          if (mode === "demo") { return demoFor(r); }
          return null;
        }
        function fmt(v, unit, digits) {
          if (v === null || typeof v === "undefined") { return t("na"); }
          if (digits) { v = Math.round(v * 10) / 10; } else { v = Math.round(v); }
          return v + unit;
        }

        /* ---------- render ---------- */
        var grid = document.getElementById("grid");
        var elSearch = document.getElementById("search");
        var elRegion = document.getElementById("region");
        var elSort = document.getElementById("sort");
        var elFav = document.getElementById("fav-toggle");
        var elRefresh = document.getElementById("refresh");
        var elLang = document.getElementById("lang");
        var elMeta = document.getElementById("t-meta");
        var favOnly = false;

        function populateRegionSelect() {
          var current = elRegion.value;
          var seen = {};
          var html = '<option value="all" id="t-allregions">' + t("allregions") + "</option>";
          RESORTS.forEach(function (r) {
            if (seen[r.r]) { return; }
            seen[r.r] = true;
            html += '<option value="' + r.r + '">' + REGIONS[r.r][LANG] + "</option>";
          });
          elRegion.innerHTML = html;
          elRegion.value = seen[current] ? current : "all";
        }

        function applyStaticText() {
          setTxt("t-title", t("title"));
          setTxt("t-sub", t("sub"));
          setTxt("o-depth", t("sortDepth"));
          setTxt("o-fresh", t("sortFresh"));
          setTxt("o-forecast", t("sortForecast"));
          setTxt("o-name", t("sortName"));
          elSearch.placeholder = t("search");
          elFav.textContent = t("fav");
          elRefresh.textContent = t("refresh");
          elLang.textContent = t("langBtn");
          elFav.classList.toggle("active", favOnly);
          setHtml("t-footer", t("footer"));
          setTxt("demo-note", t("demoNote"));
          setTxt("err-note", t("errNote"));
          populateRegionSelect();
          document.documentElement.lang = LANG;
        }

        function renderMeta() {
          if (mode === "loading") { elMeta.textContent = "…"; return; }
          var dateStr = "";
          if (lastUpdate) {
            try {
              dateStr = new Intl.DateTimeFormat(LANG === "fr" ? "fr-FR" : "en-GB",
                { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(lastUpdate);
            } catch (e) {
              dateStr = lastUpdate.toLocaleString();
            }
          }
          if (mode === "demo") {
            elMeta.textContent = RESORTS.length + " " + t("statUnit") + " · demo";
          } else {
            elMeta.textContent = RESORTS.length + " " + t("statUnit") + " · " + t("updated") + " " + dateStr;
          }
        }

        function cardHtml(r, m) {
          var depthVal = m ? m.depth : null;
          var pct = (typeof depthVal === "number") ? Math.min(100, Math.round(depthVal / 250 * 100)) : 0;
          var snowClass = (m && m.fresh && m.fresh > 0) ? " ❄️" : "";
          return (
            '<div class="card">' +
              '<button class="star ' + (favs[r.n] ? "on" : "") + '" data-fav="' + escapeHtml(r.n) + '" title="' + t("fav") + '">' + (favs[r.n] ? "★" : "☆") + "</button>" +
              "<h2>" + escapeHtml(r.n) + "</h2>" +
              '<div class="region">' + escapeHtml(REGIONS[r.r][LANG]) + " · " + t("top") + " " + r.top + " m</div>" +
              '<div class="depth"><strong>' + fmt(depthVal, "") + '</strong><span>cm ' + escapeHtml(t("depth")) + (m && typeof m.temp === "number" ? " · " + (m.temp > 0 ? "+" : "") + m.temp + "°C" : "") + snowClass + "</span></div>" +
              '<div class="gauge"><div style="width:' + pct + '%"></div></div>' +
              '<div class="stats">' +
                '<div class="stat">' + escapeHtml(t("fresh")) + "<b>" + (m ? fmt(m.fresh, " cm", true) : "…") + "</b></div>" +
                '<div class="stat">' + escapeHtml(t("forecast")) + "<b>" + (m ? fmt(m.forecast, " cm", true) : "…") + "</b></div>" +
              "</div>" +
            "</div>"
          );
        }

        function render() {
          applyStaticText();
          renderMeta();
          function notice(id, show, text) {
            var el = document.getElementById(id);
            if (el) {
              el.classList.toggle("show", show);
              el.textContent = text;
            }
          }
          notice("demo-note", mode === "demo", t("demoNote") + (lastErr ? " (" + lastErr + ")" : ""));
          notice("err-note", mode === "partial", t("errNote") + (lastErr ? " (" + lastErr + ")" : ""));

          var q = elSearch.value.trim().toLowerCase();
          var region = elRegion.value;
          var sortKey = elSort.value;

          var list = RESORTS.filter(function (r) {
            if (region !== "all" && r.r !== region) { return false; }
            if (favOnly && !favs[r.n]) { return false; }
            if (q && r.n.toLowerCase().indexOf(q) === -1 &&
                REGIONS[r.r][LANG].toLowerCase().indexOf(q) === -1) { return false; }
            return true;
          });

          function val(r, key) {
            var m = metric(r);
            if (!m) { return key === "name" ? r.n : -1; }
            if (key === "name") { return r.n; }
            var v = m[key];
            return (typeof v === "number") ? v : -1;
          }
          list.sort(function (a, b) {
            if (sortKey === "name") { return val(a, "name").localeCompare(val(b, "name")); }
            return val(b, sortKey) - val(a, sortKey);
          });

          if (!list.length) {
            grid.innerHTML = '<p class="empty">' + escapeHtml(t("empty")) + "</p>";
            return;
          }
          var html = "";
          list.forEach(function (r) {
            if (mode === "loading") { html += cardHtml(r, null); }
            else { html += cardHtml(r, metric(r)); }
          });
          grid.innerHTML = html;
        }

        /* ---------- events ---------- */
        var searchTimer = null;
        elSearch.addEventListener("input", function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(render, 120);
        });
        elRegion.addEventListener("change", render);
        elSort.addEventListener("change", render);
        elFav.addEventListener("click", function () {
          favOnly = !favOnly;
          render();
        });
        elRefresh.addEventListener("click", function () { loadLive(); });
        elLang.addEventListener("click", function () {
          LANG = (LANG === "fr") ? "en" : "fr";
          storeSet("fsr-lang", LANG);
          render();
        });
        grid.addEventListener("click", function (ev) {
          var btn = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-fav") : null;
          if (!btn) { return; }
          if (favs[btn]) { delete favs[btn]; } else { favs[btn] = true; }
          storeSet("fsr-fav", JSON.stringify(Object.keys(favs)));
          render();
        });
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && mode === "demo") { loadLive(); }
        });

        /* ---------- go ---------- */
        render();
        loadLive();
      })();
    </script>
